<style>
/* Nocturne: warm black ground, bone text, one vermilion accent. Full-bleed pixel canvas, thin HUD strips top and bottom. */
:root{
  --ground:#0B0A09;
  --line:#2A2621;
  --line-strong:#3A342D;
  --text:#E8E0D0;
  --muted:#A39886;
  --accent:#E8694A;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;}
body{background:var(--ground);color:var(--text);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#c{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;}
#c.grabbing{cursor:grabbing;}
.hud{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:2;}
.hud.top{top:0;padding-top:calc(14px + env(safe-area-inset-top, 0px));}
.hud.bot{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));}
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.grp.r{justify-content:flex-end;margin-left:auto;}
.hud span{background:var(--ground);padding:4px 6px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.hud .brand{color:var(--text);font-weight:600;}
.hud .val{color:var(--text);}
.hud .tag{border:1px solid var(--line-strong);padding:3px 6px;}
.hud .tag.warn{color:var(--accent);border-color:var(--accent);}
.btn{pointer-events:auto;text-decoration:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--text);
  background:var(--ground);border:1px solid var(--line);padding:8px 12px;}
.btn:hover{border-color:var(--text);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
html.embed .hud{display:none;}
#tip{position:fixed;left:0;top:0;z-index:3;pointer-events:none;display:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  line-height:1.5;background:var(--ground);border:1px solid var(--line-strong);padding:5px 8px;white-space:nowrap;color:var(--muted);
  font-variant-numeric:tabular-nums;}
#tip b{display:block;color:var(--text);font-weight:600;}
@media (max-width:520px){ .hide-s{display:none;} }
/* satellite panel: right side on desktop, bottom sheet on phones */
#panel{position:fixed;z-index:3;right:max(16px, env(safe-area-inset-right, 0px));top:50%;transform:translateY(-50%);width:260px;
  box-sizing:border-box;background:var(--ground);border:1px solid var(--line-strong);padding:16px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;}
#panel[hidden]{display:none;}
#panel.pulse{animation:pBorder .6s steps(4) both;}
#panel.pulse #pName{animation:pText .6s steps(4) both;}
@keyframes pBorder{from{border-color:var(--accent);}to{border-color:var(--line-strong);}}
@keyframes pText{from{color:var(--accent);}to{color:var(--text);}}
@media (prefers-reduced-motion:reduce){#panel.pulse,#panel.pulse #pName{animation:none;}}
#sprite{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid var(--line);margin-bottom:14px;}
.pkind{color:var(--accent);}
#pName{margin:4px 0 14px;font-size:15px;letter-spacing:.08em;color:var(--text);font-weight:600;}
#panel dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;}
#panel dt{color:var(--muted);}
#panel dd{margin:0;color:var(--text);text-align:right;white-space:nowrap;}
#pClose{position:absolute;top:-1px;right:-1px;padding:4px 9px;cursor:pointer;}
#pLink{display:block;text-align:center;margin-top:16px;}
#pLink[hidden]{display:none;}
@media (max-width:640px){
  #panel{left:max(16px, env(safe-area-inset-left, 0px));width:auto;top:auto;transform:none;padding:12px;
    bottom:calc(64px + env(safe-area-inset-bottom, 0px));display:grid;grid-template-columns:104px 1fr;column-gap:12px;align-items:start;}
  #sprite{grid-row:span 2;margin:0;}
  #pName{margin:4px 0 0;font-size:13px;}
  #panel dl{grid-column:1/-1;grid-template-columns:auto 1fr auto 1fr;margin:12px 0 0;gap:6px 10px;}
  #pLink{grid-column:1/-1;}
}
</style>
</head>

  </dl>

</aside>

  let i = 0, p = 0, on = 0;
  while (i < s.length) {
    let v = 0, sh = 0, b;

/* ---------- biomes: 0 ocean, 1 green land, 2 desert, 3 ice ----------
   Rough boxes [lonW, lonE, latS, latN]; a per-texel hash wobbles each edge by
   up to ~2 degrees so they don't look ruled. Good enough at ~200 px. */
{
  const DESERT = [[-17, 33, 15, 31], [34, 60, 13, 31], [52, 73, 25, 33], [75, 112, 37, 45],
                  [116, 142, -31, -20], [12, 25, -28, -18], [-117, -105, 28, 36]];
  for (let r = 0; r < LAND_H; r++) {
    const lat0 = 90 - (r + 0.5) * 180 / LAND_H;
    for (let c = 0; c < LAND_W; c++) {
      const i = r * LAND_W + c;
      if (!land[i]) continue;
      let h = Math.imul(c * 73856093 ^ r * 19349663, 2654435761);
      h = ((h ^ (h >>> 13)) >>> 0) / 4294967296 - 0.5;
      const lat = lat0 + h * 4, lon = (c + 0.5) / LAND_W * 360 - 180 + h * 4;
      if (lat < -60 || lat > 78 || (lat > 59.5 && lon > -74 && lon < -11)) land[i] = 3;   // Antarctica, high Arctic, Greenland
      else if (DESERT.some(b => lon > b[0] && lon < b[1] && lat > b[2] && lat < b[3])) land[i] = 2;
    }
  }
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const devW = Math.round(innerWidth * dpr), devH = Math.round(innerHeight * dpr);
  k = Math.max(1, Math.round(Math.min(devW * 0.42, devH * 0.34) / 100));   // integer upscale, globe ~200 px across

    let h = Math.imul(x * 374761393 + y * 668265263 ^ 0x5bd1e995, 1274126177);

function lonCol(dx, dz) { const c = Math.atan2(dx, dz) / (2 * Math.PI) * LAND_W; return c < 0 ? c + LAND_W : c; }
function buildTable(R, phi) {

  const y0 = Math.max(0, Math.floor(cy - R - 2)), y1 = Math.min(ih - 1, Math.ceil(cy + R + 2));

  let n = 0, m = 0;

    const dy = (cy - (y + 0.5)) / R;
    for (let x = x0; x <= x1; x++) {
      const dx = ((x + 0.5) - cx) / R, rr = dx * dx + dy * dy;

function updateSun(ms) {

  const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  const gmst = (280.46061837 + 360.98564736629 * n) * DEG;
  let lon = ra - gmst; lon = Math.atan2(Math.sin(lon), Math.cos(lon));

  sun.x = Math.cos(dec) * Math.cos(lon); sun.y = Math.cos(dec) * Math.sin(lon); sun.z = Math.sin(dec);

  if (anim) {
    let u = Math.min(1, (t - anim.t) / anim.d); u = u * u * (3 - 2 * u);
    lam = anim.l0 + (anim.l1 - anim.l0) * u; phi = anim.p0 + (DEFAULT_PHI - anim.p0) * u; zoom = anim.z0 + (1 - anim.z0) * u;
    if (u >= 1) { anim = null; lastInput = t; }
  } else if (!drag && !pinch) {
    if (!reduced && (velL || velP)) {
      lam += velL * dt; phi = clamp(phi + velP * dt, -PHI_MAX, PHI_MAX);
      const f = Math.exp(-dt * 2.2); velL *= f; velP *= f;
      if (Math.abs(velL) + Math.abs(velP) < 1e-3) velL = velP = 0;
    }
    const target = (!reduced && t - lastInput > IDLE_MS) ? AUTO_SPIN : 0;
    spin += (target - spin) * Math.min(1, dt * 0.8);
    lam += spin * dt;
  }
  lam = Math.atan2(Math.sin(lam), Math.cos(lam));

  const sec = Math.floor(ms / 1000);
  if (sec !== lastSec) {
    lastSec = sec;
    updateSun(ms);
    const d = new Date(ms);
    elClock.textContent = `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())} UTC`;
  }

  const R = R0 * zoom;
  if (R !== tabR || phi !== tabPhi) buildTable(R, phi);
  px.set(bg);

  // globe: land/ocean lookup, day/night + limb shading, ordered dither into 5 levels
  let off = ((lam / (2 * Math.PI) + 0.5) * LAND_W) % LAND_W; if (off < 0) off += LAND_W;
  const sD = sun.sinD, cD = sun.cosD, sc = sun.col;
  for (let i = 0; i < nT; i++) {
    let c = (T_col[i] + off) | 0; if (c >= LAND_W) c -= LAND_W;
    let dc = c - sc; if (dc < 0) dc += LAND_W;
    const l = T_sl[i] * sD + T_cl[i] * cD * COS[dc];
    let d = (l + 0.05) * 4; d = d < 0 ? 0 : d > 1 ? 1 : d;
    let lv = ((0.3 + 0.7 * d) * T_m[i] * (LEVELS - 1) + T_th[i]) | 0; if (lv >= LEVELS) lv = LEVELS - 1;
    px[T_idx[i]] = PAL[land[T_row[i] + c] * LEVELS + lv];
  }
  for (let i = 0; i < rimN; i++) {
    let c = (RIM_col[i] + off) | 0; if (c >= LAND_W) c -= LAND_W;
    let dc = c - sc; if (dc < 0) dc += LAND_W;
    px[RIM_idx[i]] = C_RIM[RIM_sl[i] * sD + RIM_cl[i] * cD * COS[dc] > -0.05 ? 1 : 0];
  }

  // view basis: E (screen right), Nn (screen up), C (towards viewer)
  const sl = Math.sin(lam), cl = Math.cos(lam), sp = Math.sin(phi), cp = Math.cos(phi);
  const Ex = -sl, Ey = cl, Nx = -sp * cl, Ny = -sp * sl, Nz = cp, Cx = cp * cl, Cy = cp * sl, Cz = sp;

  // coastlines + borders: 1-pixel lines, front hemisphere only, dimmer on the night side
  for (let p = 0, j = 0; p < B_VIS.length; p++, j += 3) {
    const x = B_XYZ[j], y = B_XYZ[j + 1], z = B_XYZ[j + 2];
    if (x * Cx + y * Cy + z * Cz <= 0.02) { B_VIS[p] = 0; continue; }
    B_SX[p] = cx + (x * Ex + y * Ey) * R; B_SY[p] = cy - (x * Nx + y * Ny + z * Nz) * R;
    B_VIS[p] = x * sun.x + y * sun.y + z * sun.z > -0.05 ? 2 : 1;   // 2 = day, 1 = night
  }
  for (let ln = 0; ln < B_START.length - 1; ln++) {
    const cols = ln < B_COAST ? C_COAST : C_BORDER;
    for (let p = B_START[ln] + 1; p < B_START[ln + 1]; p++) {
      if (!B_VIS[p] || !B_VIS[p - 1]) continue;
      line(B_SX[p - 1] | 0, B_SY[p - 1] | 0, B_SX[p] | 0, B_SY[p] | 0, cols[B_VIS[p] - 1]);
    }
  }
  const f = N ? clamp((ms / 1000 - t0) / step, 0, 1.5) : 0;
  const ux = sun.x, uy = sun.y, uz = sun.z;

  // selected satellite's orbit (plane through p0, p1 and the centre), dotted, behind the dots
  if (sel >= 0) {
    const j = sel * 3;
    const ax = P0[j], ay = P0[j + 1], az = P0[j + 2], bx = P1[j], by = P1[j + 1], bz = P1[j + 2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const nl = Math.hypot(nx, ny, nz);
    if (nl > 0) {
      nx /= nl; ny /= nl; nz /= nl;
      const r = Math.hypot(ax, ay, az);
      const qx = ax / r, qy = ay / r, qz = az / r;
      const wx = ny * qz - nz * qy, wy = nz * qx - nx * qz, wz = nx * qy - ny * qx;
      const steps = Math.max(120, Math.round(R * 6));
      for (let s = 0; s < steps; s += 2) {
        const a = s / steps * 2 * Math.PI, ca = Math.cos(a) * r, sa = Math.sin(a) * r;
        const x = ca * qx + sa * wx, y = ca * qy + sa * wy, z = ca * qz + sa * wz;
        const vx = x * Ex + y * Ey, vy = x * Nx + y * Ny + z * Nz, vz = x * Cx + y * Cy + z * Cz;
        if (vz < 0 && vx * vx + vy * vy < 1) continue;
        const X = cx + vx * R, Y = cy - vy * R;
        if (X >= 0 && Y >= 0 && X < iw && Y < ih) px[(Y | 0) * iw + (X | 0)] = C_ORBIT;
      }
    }
  }

  // satellites: interpolate t0..t1 in 3-D, hide behind the globe, darker in Earth's shadow or beyond the limb
  for (let i = 0, j = 0; i < N; i++, j += 3) {
    const x = P0[j] + (P1[j] - P0[j]) * f, y = P0[j + 1] + (P1[j + 1] - P0[j + 1]) * f, z = P0[j + 2] + (P1[j + 2] - P0[j + 2]) * f;
    const vx = x * Ex + y * Ey, vy = x * Nx + y * Ny + z * Nz, vz = x * Cx + y * Cy + z * Cz;
    if (vz < 0 && vx * vx + vy * vy < 1) { SX[i] = -1; continue; }
    const X = cx + vx * R, Y = cy - vy * R;
    if (X < 0 || Y < 0 || X >= iw || Y >= ih) { SX[i] = -1; continue; }
    SX[i] = X; SY[i] = Y;
    const ds = x * ux + y * uy + z * uz;
    const shadow = ds < 0 && x * x + y * y + z * z - ds * ds < 1;
    px[(Y | 0) * iw + (X | 0)] = shadow || vz < 0 ? C_SAT_DARK : C_SAT;   // far side of the limb reads as depth
  }

  // selection: bone dot inside corner brackets, label follows it
  if (sel >= 0 && SX[sel] >= 0) {
    const X = SX[sel] | 0, Y = SY[sel] | 0;
    for (let q = 0; q < RETICLE.length; q += 2) {
      const x = X + RETICLE[q], y = Y + RETICLE[q + 1];
      if (x >= 0 && y >= 0 && x < iw && y < ih) px[y * iw + x] = C_SEL;
    }
    const j = sel * 3;
    const x = P0[j] + (P1[j] - P0[j]) * f, y = P0[j + 1] + (P1[j + 1] - P0[j + 1]) * f, z = P0[j + 2] + (P1[j + 2] - P0[j + 2]) * f;
    const r = Math.hypot(x, y, z), lat = Math.asin(z / r) / DEG, lon = Math.atan2(y, x) / DEG;
    const alt = Math.round(A0[sel] + (A1[sel] - A0[sel]) * f);
    const info = `${alt} km · ${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
    if (tipInfo.textContent !== info) tipInfo.textContent = info;
    if (!tipShown) showTip();
    const cssX = (X + 0.5) * k / dpr, cssY = (Y + 0.5) * k / dpr;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let lx = cssX + 14, ly = cssY - h - 10;
    if (lx + w > innerWidth - 8) lx = cssX - w - 14;
    if (ly < 8) ly = cssY + 14;
    tip.style.transform = `translate(${Math.round(clamp(lx, 8, innerWidth - w - 8))}px,${Math.round(ly)}px)`;
  } else if (tipShown) { tip.style.display = 'none'; tipShown = false; }

  // panel: live values 4x a second, sprite every frame
  if (panelFor && sel >= 0) {
    if (ms - panelT > 250) {
      panelT = ms;
      const j = sel * 3;
      const x = P0[j] + (P1[j] - P0[j]) * f, y = P0[j + 1] + (P1[j + 1] - P0[j + 1]) * f, z = P0[j + 2] + (P1[j + 2] - P0[j + 2]) * f;
      const r = Math.hypot(x, y, z), lat = Math.asin(z / r) / DEG, lon = Math.atan2(y, x) / DEG;
      const alt = Math.round(A0[sel] + (A1[sel] - A0[sel]) * f);
      const ds = x * ux + y * uy + z * uz, shadow = ds < 0 && r * r - ds * ds < 1;
      pAlt.textContent = alt + ' km';
      pSpd.textContent = Math.sqrt(398600.4418 / (RE + alt)).toFixed(2) + ' km/s';   // circular-orbit speed
      pLat.textContent = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}`;
      pLon.textContent = `${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;
      pSun.textContent = shadow ? 'Earth shadow' : 'Sunlit';
    }
    drawSprite(ms);
  }

  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
loadPositions();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
